# Builds the standalone app for Windows, macOS and Linux, runs its self-test on each,
# and publishes them as a GitHub Release when a version tag (v1.2.3) is pushed.
# Can also be started by hand from the Actions tab (the builds are then kept as artifacts).
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libfontconfig1

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$v\"/" ledwall/version.py && rm ledwall/version.py.bak
          cat ledwall/version.py

      - name: Build
        run: pyinstaller --noconfirm LEDWallCreator.spec

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/LEDWallCreator/LEDWallCreator.exe" -ArgumentList "--selftest","--selftest-log=selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Get-Content selftest.log -Tail 25 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/LEDWallCreator.app/Contents/MacOS/LEDWallCreator --selftest --selftest-log=selftest.log
          code=$?
          cat selftest.log
          if [ $code -ne 0 ]; then tail -n 25 selftest.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          dist/LEDWallCreator/LEDWallCreator --selftest --selftest-log=selftest.log
          code=$?
          cat selftest.log
          if [ $code -ne 0 ]; then tail -n 25 selftest.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../LEDWallCreator-windows.zip LEDWallCreator > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent LEDWallCreator.app ../LEDWallCreator-macos.zip
          else
            tar -czf ../LEDWallCreator-linux.tar.gz LEDWallCreator
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LEDWallCreator-${{ matrix.name }}
          path: python/LEDWallCreator-*
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
