# Builds the standalone app for Windows (installer + portable zip), macOS and Linux, runs its self-test on each,
# and publishes them as a GitHub Release when a version tag (v1.2.3) is pushed.
# Can also be started by hand from the Actions tab (the builds are then kept as artifacts).
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          # retried: the package mirrors fail now and then
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libfontconfig1 && exit 0
            echo "apt failed, retrying in 20 s"; sleep 20
          done
          exit 1

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$v\"/" ledwall/version.py && rm ledwall/version.py.bak
          cat ledwall/version.py

      - name: Build
        run: pyinstaller --noconfirm LEDWallCreator.spec

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/LEDWallCreator/LEDWallCreator.exe" -ArgumentList "--selftest","--selftest-log=selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Get-Content selftest.log -Tail 25 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (Select-String -Path ledwall/version.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$v" installer\LEDWallCreator.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installer test (install, self-test, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "C:\lwc-installer-test"
          $p = Start-Process dist\LEDWallCreator-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::Setup exited with $($p.ExitCode)"; exit 1 }
          foreach ($f in "$dir\LEDWallCreator.exe", "$dir\unins000.exe", "$env:PUBLIC\Desktop\LED Wall Creator.lnk") {
            if (-not (Test-Path $f)) { Write-Output "::error::Missing after install: $f"; exit 1 }
          }
          $assoc = (Get-ItemProperty "HKLM:\Software\Classes\LEDWallCreator.Project\shell\open\command").'(default)'
          Write-Output "open command: $assoc"
          $p = Start-Process "$dir\LEDWallCreator.exe" -ArgumentList "--selftest","--selftest-log=installed-selftest.log" -Wait -PassThru
          Get-Content installed-selftest.log -Tail 5
          if ($p.ExitCode -ne 0) { Write-Output "::error::Installed app failed its self-test"; exit 1 }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5      # the uninstaller finishes removing itself after it exits
          if (Test-Path "$dir\LEDWallCreator.exe") { Write-Output "::error::Uninstall left the app behind"; exit 1 }
          if (Test-Path "$env:PUBLIC\Desktop\LED Wall Creator.lnk") { Write-Output "::error::Uninstall left the desktop shortcut"; exit 1 }
          if (Test-Path "HKLM:\Software\Classes\LEDWallCreator.Project") { Write-Output "::error::Uninstall left the file association"; exit 1 }
          Write-Output "install / uninstall OK"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/LEDWallCreator.app/Contents/MacOS/LEDWallCreator --selftest --selftest-log=selftest.log
          code=$?
          cat selftest.log
          if [ $code -ne 0 ]; then tail -n 25 selftest.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          dist/LEDWallCreator/LEDWallCreator --selftest --selftest-log=selftest.log
          code=$?
          cat selftest.log
          if [ $code -ne 0 ]; then tail -n 25 selftest.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../LEDWallCreator-windows.zip LEDWallCreator > /dev/null
            cp LEDWallCreator-Setup.exe ../          # the installer (what the website offers)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent LEDWallCreator.app ../LEDWallCreator-macos.zip
          else
            tar -czf ../LEDWallCreator-linux.tar.gz LEDWallCreator
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LEDWallCreator-${{ matrix.name }}
          path: python/LEDWallCreator-*
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
